# TLS options for every HTTPS router. These are dynamic configuration: Traefik ignores a
# `tls:` block in the static traefik.yml, so they live here.
# https://doc.traefik.io/traefik/https/tls/#tls-options
tls:
  options:
    default:
      minVersion: VersionTLS12
      # Refuse TLS handshakes that do not name a configured host, instead of answering
      # with Traefik's default certificate.
      sniStrict: true
      # TLS 1.2 only. Go picks the TLS 1.3 cipher suites itself.
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
