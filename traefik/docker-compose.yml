# Pinned project name: keeps the container and network names the same wherever this folder lives.
name: traefik

services:
  traefik:
    image: "traefik:v3.7.14"
    container_name: "traefik"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    ports:
      # IPv4 only. Docker publishes a bare "80:80" on IPv6 as well, and Docker's port rules
      # bypass the host firewall. Add "[::]:80:80" and "[::]:443:443" only if you need IPv6.
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./dynamic:/etc/traefik/dynamic:ro"
      - "./acme.json:/etc/traefik/acme.json"
      - "./logs:/etc/traefik/logs"
    environment:
      # Only used by the DNS-01 challenge in traefik.cloudflare.example.yml. Set it in .env.
      - "CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
