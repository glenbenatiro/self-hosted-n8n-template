# logrotate rule for Traefik's access log. Install it with the command in README.md, which
# fills in this folder's real path below.
/path/to/traefik/logs/*.log {
    su root root
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        # Traefik reopens its log files on USR1.
        docker kill --signal=USR1 traefik >/dev/null 2>&1 || true
    endscript
}
