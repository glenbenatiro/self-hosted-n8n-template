# logrotate rule for Traefik's access log. Install it with the command in README.md, which
# fills in this folder's real path below.
/path/to/traefik/logs/*.log {
    su root root
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    # Copy the log, then empty it in place, so Traefik never needs a signal. Traefik opens
    # the file in append mode, so it carries on writing at the start of the emptied file.
    # Do not send USR1 with `docker kill`: Docker records any `docker kill` as a manual stop,
    # and a container with `restart: unless-stopped` then stays down after Docker restarts.
    copytruncate
}
